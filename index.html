<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        h1{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: blue;
        }
        .lowkey{
            background-color: aqua;
            color: #2f2f2f;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 30px;
            font-weight: 600;
        }
    </style>
</head>
<body id="body">
    <h1>Welcome to my Website!</h1>
    <button id="changebg">Click me</button>
    <div> 
        <p class="lowkey"> Lorem ipsum dolor sit amet consectetur adipisicing elit. Possimus officia accusantium est voluptates repellendus et. Eos vitae animi voluptates optio culpa? Suscipit sequi laboriosam voluptatem veritatis aspernatur cumque molestiae facere?</p>
    </div>

    <script>
        const changeBg = document.getElementById("changebg")
        // changeBg.onClick = () => {
        //     changeBackground()
        // }
        const changeBackground = () => {
            document.getElementById("body").style.backgroundColor = "orange"
        }
        changeBg.onclick = () => {changeBackground()}
    </script>
</body>
</html>
